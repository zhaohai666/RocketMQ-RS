[package]
name = "rocketmq-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Rust implementation of RocketMQ server components"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
hmac = "0.12"
md5 = "0.8"
prost = "0.13"
prost-types = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tonic = { version = "0.12", features = ["tls"] }

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"

[[bin]]
name = "rocketmq"
path = "src/main.rs"
