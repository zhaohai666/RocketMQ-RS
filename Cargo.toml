[package]
name = "rocketmq-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Rust implementation of RocketMQ server components"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rocketmq"
path = "src/main.rs"
